name: Build & Scan Docker Image

on:
  push:
    branches: [dev]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: 🧪 Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore

      - name: 🧪 Run Unit Tests and Export TRX
        run: dotnet test --no-build --logger "trx" --results-directory TestResults

      - name: 📊 Generate HTML Report from TRX
        uses: danielpalme/reportgenerator-action@5.1.23
        with:
          reports: 'TestResults/*.trx'
          targetdir: 'TestResultsHtml'
          reporttypes: 'Html'

      - name: 📎 Upload HTML Test Report
        uses: actions/upload-artifact@v3
        with:
          name: html-test-report
          path: TestResultsHtml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t api-unittest:latest .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-unittest:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Scan to GitHub Dashboard
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: 🚀 Push Docker Image
        run: |
          docker tag api-unittest:latest sooyaa02/api-unittest:latest
          docker push sooyaa02/api-unittest:latest

      - name: 📧 Send Mail Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ CI/CD Pipeline Succeeded"
          to: chol.www02@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ✅ All CI steps completed successfully.
            - 🧪 Unit Tests passed
            - 📊 Test Report generated
            - 🐳 Docker Image built and pushed
            - 🔍 Trivy scan completed
            - 📦 Image: sooyaa02/api-unittest:latest